<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="style.css">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <script>
            $(document).ready(function(){
                let x, y, dist, speed, speedUp = 1;
                $(document).mousedown(function(event){
                    if(x == undefined && y == undefined){
                        x = Math.max(20, Math.min(event.clientX, $(window).width() - 20));
                        y = Math.max(20, Math.min(event.clientY, $(window).height() - 20));
                        $("body").append(`<div id="ball" style="left:${x}px; top:20px;"></div>`);
                        $("#ball").mousedown(function(e){
                            $("#ball").stop(true);
                            $("#ball").remove();
                            x = undefined;
                            y = undefined;
                            speedUp = 1;
                            setTimeout(function(){alert("You win! Click anywhere to start a new game!")}, 100)
                            e.stopPropagation();
                        })
                        moveBall();
                    }

                    function moveBall() {
                        speed = Math.max(Math.floor((($(window).height() + $(window).width()) * (1/3))), 300);
                        dist = Math.hypot(x - 20, y - 20);

                        $("#ball").animate({left: 20, top: `${y}px`}, 
                        ((dist/speed) * 1000 * speedUp), "linear");

                        dist = Math.hypot(x - 20, $(window).height() - y - 20);

                        $("#ball").animate({left: `${x}px`, top: $(window).height()-20}, 
                        ((dist/speed) * 1000 * speedUp), "linear");

                        dist = Math.hypot($(window).width() - x - 20, $(window).height() - y - 20);

                        $("#ball").animate({left: $(window).width()-20, top: `${y}px`}, 
                        ((dist/speed) * 1000 * speedUp), "linear");

                        dist = Math.hypot($(window).width() - x - 20, y - 20);

                        $("#ball").animate({left: `${x}px`, top: 20}, 
                        ((dist/speed) * 1000 * speedUp), "linear", function(){
                            if(speedUp > 0.3) speedUp -= 0.05;
                            moveBall();
                        });
                    }
                });
            });
        </script>
    </head>
    <body>

    </body>
</html>
